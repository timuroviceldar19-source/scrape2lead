name: CI

# Проверка каждой правки до слияния: типы и весь набор тестов. Раньше в проекте
# не было ни одной автоматической проверки, и правки расписания шли в бой без неё.
# Тесты КГД требуют Python с reportlab (PDF) и Chromium для Playwright (браузер).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install reportlab

      - run: npm ci

      - run: npx playwright install chromium

      - name: Types
        run: npm run lint

      - name: Tests
        run: npm test
