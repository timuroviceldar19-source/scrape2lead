name: GZ daily plans and lots

# Замена задачи Task Scheduler "Scrape2Lead Daily Prepare" (10:00 Алматы).
# 05:00 UTC = 10:00 в UTC+5. Общая concurrency-группа с gz-daily-pk.yml не даёт
# двум прогонам пересечься — это тот же инвариант, который на Windows держал
# общий runs/prepare.lock.
#
# Второй триггер в 06:00 UTC — страховка на случай недоставленного scheduled
# события (см. комментарий в gz-daily-pk.yml). Backstop пропускает себя сам,
# если сегодняшний прогон уже успешен или ещё идёт.

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Skip if a run today already succeeded or is still going
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          if [ "$EVENT" != "schedule" ]; then
            echo "Ручной запуск — выполняем безусловно."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Логика идентична gz-daily-pk.yml — подробный разбор там.
          # Для plans-and-lots это критичнее: прогон длиннее PK, поэтому шанс
          # застать основной ещё идущим на момент backstop заметно выше.
          midnight=$(date -u +%Y-%m-%dT00:00:00Z)
          blocking=$(gh run list --workflow gz-daily-main.yml --limit 30 \
            --json databaseId,status,conclusion,createdAt \
            --jq "[.[]
                   | select(.databaseId != (env.SELF_RUN_ID | tonumber))
                   | select(.status != \"completed\"
                            or (.conclusion == \"success\" and .createdAt >= \"$midnight\"))
                  ] | length")
          if [ "$blocking" -gt 0 ]; then
            echo "Сегодня уже есть успешный или активный прогон ($blocking) — backstop пропускаем."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Успешных и активных прогонов нет — запускаем."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  plans-and-lots:
    needs: guard
    if: needs.guard.outputs.should-run == 'true'
    uses: ./.github/workflows/gz-automation.yml
    with:
      config: config/automation.json
      runs-dir: runs
      log-path: runs/scheduler.log
    secrets:
      BITRIX24_WEBHOOK_URL: ${{ secrets.BITRIX24_WEBHOOK_URL }}
