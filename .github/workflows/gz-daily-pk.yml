name: GZ daily PK plans

# Замена задачи Task Scheduler "Scrape2Lead Daily PK Plans" (08:40 Алматы).
# Казахстан живёт в UTC+5 без перехода на летнее время, поэтому 03:40 UTC
# соответствует 08:40 круглый год.
#
# Второй триггер в 04:40 UTC — страховка: 2026-07-26 GitHub не доставил
# запланированное событие вообще (в репозитории не появилось ни одного run с
# event=schedule), и пропуск заметили только по отсутствию записей в CRM.
# Backstop пропускает себя сам, если сегодня уже был успешный прогон.

on:
  schedule:
    - cron: "40 3 * * *"
    - cron: "40 4 * * *"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Skip if this workflow already succeeded today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" != "schedule" ]; then
            echo "Ручной запуск — выполняем безусловно."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Оба триггера этого workflow приходятся на утро UTC, поэтому граница
          # «сегодня по UTC» однозначно разделяет основной запуск и backstop.
          midnight=$(date -u +%Y-%m-%dT00:00:00Z)
          done_today=$(gh run list --workflow gz-daily-pk.yml --status success \
            --limit 20 --json createdAt \
            --jq "[.[] | select(.createdAt >= \"$midnight\")] | length")
          if [ "$done_today" -gt 0 ]; then
            echo "Сегодня уже был успешный прогон ($done_today) — backstop пропускаем."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Успешных прогонов сегодня нет — запускаем."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  pk-plans:
    needs: guard
    if: needs.guard.outputs.should-run == 'true'
    uses: ./.github/workflows/gz-automation.yml
    with:
      config: config/automation.pk.json
      runs-dir: runs/pk
      log-path: runs/pk/scheduler.log
    secrets:
      BITRIX24_WEBHOOK_URL: ${{ secrets.BITRIX24_WEBHOOK_URL }}
