name: GZ daily PK plans

# Замена задачи Task Scheduler "Scrape2Lead Daily PK Plans" (08:40 Алматы).
# Казахстан живёт в UTC+5 без перехода на летнее время, поэтому 03:40 UTC
# соответствует 08:40 круглый год.
#
# Второй триггер в 04:40 UTC — страховка: 2026-07-26 GitHub не доставил
# запланированное событие вообще (в репозитории не появилось ни одного run с
# event=schedule), и пропуск заметили только по отсутствию записей в CRM.
# Backstop пропускает себя сам, если сегодняшний прогон уже успешен или ещё идёт.

on:
  schedule:
    - cron: "40 3 * * *"
    - cron: "40 4 * * *"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Skip if a run today already succeeded or is still going
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          if [ "$EVENT" != "schedule" ]; then
            echo "Ручной запуск — выполняем безусловно."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Блокирует не только успех, но и ещё идущий прогон. Guard живёт в
          # вызывающем workflow и потому НЕ стоит в concurrency-очереди: без
          # проверки активности он в 04:40 увидел бы ноль успехов, пропустил
          # себя дальше, и вызванный workflow встал бы в очередь и отработал
          # повторно после основного — ровно в холодном сценарии (~65 мин против
          # зазора в 60), где дублировать нагрузку на портал дороже всего.
          #
          # Активность блокирует независимо от даты старта: прогон, начатый до
          # полуночи UTC и всё ещё идущий, — та же причина не запускать второй.
          # Успех же засчитывается только сегодняшний. Свой собственный run
          # исключаем — на момент запроса он сам in_progress.
          #
          # Упавший или отменённый прогон не блокирует: backstop для того и
          # нужен. Если основной падает уже ПОСЛЕ проверки, backstop его не
          # подхватит — этот случай ловит gz-watchdog.yml.
          midnight=$(date -u +%Y-%m-%dT00:00:00Z)
          blocking=$(gh run list --workflow gz-daily-pk.yml --limit 30 \
            --json databaseId,status,conclusion,createdAt \
            --jq "[.[]
                   | select(.databaseId != (env.SELF_RUN_ID | tonumber))
                   | select(.status != \"completed\"
                            or (.conclusion == \"success\" and .createdAt >= \"$midnight\"))
                  ] | length")
          if [ "$blocking" -gt 0 ]; then
            echo "Сегодня уже есть успешный или активный прогон ($blocking) — backstop пропускаем."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Успешных и активных прогонов нет — запускаем."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  pk-plans:
    needs: guard
    if: needs.guard.outputs.should-run == 'true'
    uses: ./.github/workflows/gz-automation.yml
    with:
      config: config/automation.pk.json
      runs-dir: runs/pk
      log-path: runs/pk/scheduler.log
    secrets:
      BITRIX24_WEBHOOK_URL: ${{ secrets.BITRIX24_WEBHOOK_URL }}
      GOSZAKUP_TOKEN: ${{ secrets.GOSZAKUP_TOKEN }}

  # Итоги закупок по открытым сделкам: договор (с кем), статус плана. Пишет
  # менеджеру комментарий один раз на событие, этапы не двигает. Едет на том
  # же надёжном триггере, что и сбор, и не зависит от его успеха: договоры
  # берутся из API, а не из сегодняшней выгрузки.
  #
  # continue-on-error: guard и gz-watchdog.yml считают прогон удачным по
  # conclusion всего run. Сбой этой проверки не должен выглядеть как сбой
  # сбора и запускать backstop-сбор повторно.
  deal-outcomes:
    needs: [guard, pk-plans]
    if: always() && needs.guard.outputs.should-run == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: gz-deal-outcomes
      cancel-in-progress: false
    env:
      TZ: Asia/Almaty
      BITRIX24_WEBHOOK_URL: ${{ secrets.BITRIX24_WEBHOOK_URL }}
      GOSZAKUP_TOKEN: ${{ secrets.GOSZAKUP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check deal outcomes
        run: npx tsx scripts/check-gz-deal-outcomes.mts --execute --report logs/gz-deal-outcomes.json

      - name: Upload outcome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gz-deal-outcomes-${{ github.run_id }}
          path: logs/gz-deal-outcomes.json
          retention-days: 30
          if-no-files-found: warn
