name: GZ automation (reusable)

# Общее тело ежедневной автоматизации. Вызывается из gz-daily-pk.yml и
# gz-daily-main.yml — заменяет две задачи Windows Task Scheduler, которые
# работали только когда пользователь залогинен на конкретном компьютере.

on:
  workflow_call:
    inputs:
      config:
        description: Путь к конфигу automation (config/automation*.json)
        required: true
        type: string
      runs-dir:
        description: Каталог прогонов, должен совпадать с runsDir из конфига
        required: true
        type: string
      log-path:
        description: Путь к логу планировщика
        required: true
        type: string
      cache-scope:
        description: Область кэша плана (pk или main), у каждой задачи свой кэш
        required: true
        type: string
    secrets:
      BITRIX24_WEBHOOK_URL:
        required: true
      GOSZAKUP_TOKEN:
        required: true

# Раннеры эфемерные, поэтому runs/prepare.lock из конфига здесь ничего не
# сериализует — файла на чистой машине никогда нет. Повторные прогоны ОДНОГО
# конфига держатся по очереди только на этой группе.
#
# Группа своя у каждого конфига (runs-dir различается: runs и runs/pk), поэтому PK и
# main идут параллельно. Это допустимо, потому что их наборы планов не пересекаются
# (дедупликация в Bitrix по UF_CRM_PLAN_ID тогда не гонится сама с собой), а кэш у них
# раздельный (см. cache-scope). Если наборы когда-нибудь пересекутся — вернуть общую
# группу `gz-automation`.
concurrency:
  group: gz-automation-${{ inputs.runs-dir }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Холодный кэш деталей планов даёт ~65 мин (см. runs/pk/20260724-084004),
    # plans-and-lots вхолодную дольше. Запас до потолка GitHub в 6 часов.
    timeout-minutes: 180

    env:
      # createRunId() в src/automation/core.ts берёт локальное время, поэтому
      # без TZ идентификаторы прогонов уехали бы на 5 часов назад от казахстанских.
      TZ: Asia/Almaty
      BITRIX24_WEBHOOK_URL: ${{ secrets.BITRIX24_WEBHOOK_URL }}
      GOSZAKUP_TOKEN: ${{ secrets.GOSZAKUP_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install chromium
        # GitHub's Ubuntu image already contains Chromium's shared libraries.
        # Avoid `--with-deps`: it refreshes every configured apt repository and
        # can fail the whole automation on an unrelated mirror hash mismatch.
        run: npx playwright install chromium

      # Кэш деталей планов и реестра контрагентов. Это ускоритель, а не источник
      # правды: дедупликация сделок живёт в Bitrix (UF_CRM_PLAN_ID / ORIGINATOR_ID),
      # так что потеря кэша делает прогон медленным, но не ломает его.
      # Ключи в GHA неизменяемы, поэтому restore по префиксу + save под новым ключом.
      - name: Restore plan cache
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: data/scrape2lead.db
          key: gz-db-${{ inputs.cache-scope }}-${{ github.run_id }}
          # Второй префикс — переходный: подхватывает старый общий кэш `gz-db-<run_id>`,
          # чтобы первый прогон каждой области не стартовал вхолодную (~65 мин).
          restore-keys: |
            gz-db-${{ inputs.cache-scope }}-
            gz-db-

      # procurement.gov.kz отдаёт только листовой сертификат без промежуточного
      # (RapidSSL TLS RSA CA G1): браузер докачивает его сам, Node fetch падает с
      # UNABLE_TO_VERIFY_LEAF_SIGNATURE. Добавляем промежуточный к системным корням.
      # Если портал недоступен (сетевой сбой), запуск повторяется до трёх попыток с паузой
      # 10 минут: письмо о падении приходит только после последней. Другие ошибки не повторяются.
      - name: Run automation
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/certs/rapidssl-tls-rsa-ca-g1.crt
        run: sh scripts/run-automation-with-retry.sh '${{ inputs.config }}' '${{ inputs.log-path }}'

      # Лог раннера дублируется в вывод job — иначе он виден только в артефакте.
      - name: Show run log
        if: always()
        run: cat '${{ inputs.log-path }}' || true

      # Сводка запуска на странице прогона: сколько сделок создано/обновлено и сколько
      # занял каждый этап. Не влияет на итог job.
      - name: Run summary
        if: always()
        continue-on-error: true
        run: npx tsx scripts/gz-run-summary.mts '${{ inputs.runs-dir }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Save plan cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/scrape2lead.db
          key: gz-db-${{ inputs.cache-scope }}-${{ github.run_id }}

      # Заменяет локальный каталог runs/ для аудита: manifest.json, xlsx,
      # результаты dry-run и summary.txt.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gz-run-${{ github.run_id }}
          path: |
            ${{ inputs.runs-dir }}/**
            !${{ inputs.runs-dir }}/**/*.part.xlsx
          retention-days: 30
          if-no-files-found: warn
