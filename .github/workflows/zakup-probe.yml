name: Probe zakup.gov.kz (public API)

# Временная проверка: отвечает ли открытый API Единой платформы закупок на IP раннеров GitHub.
# Секреты не нужны. Для сравнения тот же раунд стучится в ows.goszakup.gov.kz без токена (ждём 401).
# Ветку probe/zakup-public-api удалить после проверки.

on:
  push:
    branches: [probe/zakup-public-api]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe public endpoints (5 rounds, 30 s apart)
        run: |
          cat > probe.mjs <<'EOF'
          const B = "https://zakup.gov.kz/api/core/api/public";
          const targets = [
            ["zakup contracts F3 Oct", `${B}/contracts/?supplier_organization_id=54283&sign_date__gte=2026-10-01&sign_date__lte=2026-10-31&limit=1&offset=0`],
            ["zakup plan-items", `${B}/plan-items/?limit=1&offset=0`],
            ["zakup lots", `${B}/lots/?limit=1&offset=0`],
            ["zakup eshop-orders", `${B}/eshop-orders/?limit=1&offset=0`],
            ["zakup organizations F3", `${B}/organizations/?q=061140003942&limit=1`],
            ["ows v3 graphql, no token", "https://ows.goszakup.gov.kz/v3/graphql"]
          ];
          const stats = new Map(targets.map(([n]) => [n, { ok: 0, ms: [], errors: [] }]));
          for (let round = 1; round <= 5; round++) {
            for (const [name, url] of targets) {
              const isOws = url.includes("ows.");
              const t0 = Date.now();
              try {
                const r = await fetch(url, isOws
                  ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query: "{ Contract(limit: 1) { id } }" }), signal: AbortSignal.timeout(20000) }
                  : { signal: AbortSignal.timeout(20000) });
                const text = await r.text();
                const ms = Date.now() - t0;
                let note = "";
                try { const j = JSON.parse(text); note = j.count !== undefined ? `count=${j.count}` : String(j.message ?? j.detail ?? "").slice(0, 60); } catch { note = text.slice(0, 60).replace(/\s+/g, " "); }
                const good = isOws ? r.status === 401 : r.status === 200;
                const s = stats.get(name);
                if (good) { s.ok++; s.ms.push(ms); } else s.errors.push(`HTTP ${r.status}`);
                console.log(`round ${round} | ${name} | HTTP ${r.status} | ${ms} ms | ${note}`);
              } catch (err) {
                const code = err?.cause?.code ?? err?.name ?? String(err);
                stats.get(name).errors.push(code);
                console.log(`round ${round} | ${name} | FAILED ${code} | ${Date.now() - t0} ms`);
              }
            }
            if (round < 5) await new Promise((res) => setTimeout(res, 30000));
          }
          console.log("\n=== SUMMARY");
          for (const [name, s] of stats) {
            const sorted = [...s.ms].sort((a, b) => a - b);
            const median = sorted.length ? sorted[Math.floor(sorted.length / 2)] : "-";
            console.log(`${name}: ok ${s.ok}/5, median ${median} ms${s.errors.length ? `, errors: ${s.errors.join(", ")}` : ""}`);
          }
          EOF
          node probe.mjs | tee probe.log
          echo "## zakup.gov.kz from GitHub ($(date -u +%H:%M) UTC)" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/=== SUMMARY/,$p' probe.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
