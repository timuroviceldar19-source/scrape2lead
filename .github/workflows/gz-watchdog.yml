name: GZ watchdog

# Сторож на случай, когда ежедневные задачи молча не отработали: превращает
# пропуск в явное падение с письмом вместо косвенного «в CRM ничего нет».
#
# 08:00 UTC = 13:00 Алматы. Было 07:30, сдвинуто после замера реальных задержек:
# 2026-07-26 scheduled событие для gz-daily-pk.yml пришло на 103 минуты позже
# срока (слот 04:40 → run в 06:23). При задержках такого порядка проверка в
# 07:30 успевала отработать раньше, чем приходил законно задержанный прогон, и
# давала ложную тревогу.
#
# Честное ограничение: сторож сам работает по GHA-cron и подвержен ровно той же
# задержке, поэтому он вторая линия, а не первая. Первая — внешний триггер через
# workflow_dispatch (см. README, раздел «Внешний триггер»): dispatch доставляется
# мгновенно, в отличие от schedule. Сторожа тоже стоит дёргать снаружи.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Assert both daily workflows succeeded today
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          midnight=$(date -u +%Y-%m-%dT00:00:00Z)
          failed=0

          for workflow in gz-daily-pk.yml gz-daily-main.yml; do
            count=$(gh run list --workflow "$workflow" --status success \
              --limit 20 --json createdAt \
              --jq "[.[] | select(.createdAt >= \"$midnight\")] | length")
            if [ "$count" -gt 0 ]; then
              echo "OK: $workflow — успешных прогонов сегодня: $count"
            else
              echo "ПРОПУСК: $workflow не отработал успешно с $midnight"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo
            echo "Запустить вручную: gh workflow run <workflow> --ref main"
            echo "Повторный прогон безопасен — дедупликация идёт в Bitrix по UF_CRM_PLAN_ID."
            exit 1
          fi
          echo "Обе ежедневные задачи отработали."
