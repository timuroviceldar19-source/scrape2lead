name: GZ watchdog

# Сторож на случай, когда ежедневные задачи молча не отработали: превращает
# пропуск в явное падение с письмом вместо косвенного «в CRM ничего нет».
#
# 06:30 UTC = 11:30 Алматы. Слот выбран так, чтобы попасть между двумя парами
# сбора: утренняя (08:40 PK + 10:00 main) уже закончилась, дневная (13:00 + 14:30)
# ещё не начиналась. Проверять после дневной пары смысла нет — она замаскировала
# бы пропуск утренней, а знать про пропуск нужно раньше, чем он закроется сам.
#
# Плата за ранний слот: зазор после main сжался с трёх часов до полутора.
# Пока сбор идёт по внешнему триггеру, этого хватает с запасом — dispatch
# доставляется мгновенно, а main отрабатывает за ~26 минут. Но если внешний
# триггер для main не сработал и его подхватывает внутренний GHA-backstop
# (слот 06:00 UTC), тот приезжает с задержкой до полутора часов, и сторож в
# 06:30 успеет сработать раньше. Тревога в этом случае верна на момент проверки
# (сбора сегодня действительно ещё не было), но может закрыться сама, когда
# задержанный backstop наконец отработает. Дневная пара 13:00/14:30 закроет тот
# же пропуск гарантированно.
#
# Честное ограничение: сторож сам работает по GHA-cron и подвержен ровно той же
# задержке, поэтому он вторая линия, а не первая. Первая — внешний триггер через
# workflow_dispatch (см. README, раздел «Внешний триггер»): dispatch доставляется
# мгновенно, в отличие от schedule. Сторожа тоже стоит дёргать снаружи.

on:
  schedule:
    - cron: "30 6 * * *"
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Collection window to verify"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - afternoon

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Assert both daily workflows actually collected today
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WINDOW: ${{ github.event_name == 'workflow_dispatch' && inputs.window || (github.event.schedule == '15 10 * * *' && 'afternoon' || 'morning') }}
        run: |
          set -eu
          day=$(date -u +%Y-%m-%d)
          if [ "$WINDOW" = "afternoon" ]; then
            pk_since="${day}T08:00:00Z"
            main_since="${day}T09:30:00Z"
          else
            pk_since="${day}T00:00:00Z"
            main_since="$pk_since"
          fi
          echo "Checking $WINDOW collection window (PK since $pk_since, main since $main_since)"
          failed=0

          # Успех на уровне run сюда не годится. Прогон, где guard пропустил
          # работу, тоже завершается с conclusion=success — оба задержанных
          # события 2026-07-26 были именно такими. На одном лишь run-статусе
          # сторож обманывался бы так: основной стартует в 05:00, backstop в
          # 06:00 видит его активным и пропускает себя с success, основной
          # затем падает в 06:30 — и сторож рапортует «всё хорошо», хотя не
          # собрано ничего.
          #
          # Поэтому спускаемся до job'а, который делает работу. Реальный сбор
          # даёт job "<name> / run" (вложенный вызов gz-automation.yml) с
          # conclusion=success; пропуск guard'ом — job "<name>" с
          # conclusion=skipped. Префикс имени ловит оба, фильтр по success
          # оставляет только настоящую работу.
          check() {
            workflow="$1"; job="$2"; since="$3"; work_ok=0
            for run_id in $(gh run list --workflow "$workflow" --limit 20 \
                --json databaseId,createdAt,conclusion \
                --jq "[.[]
                       | select(.createdAt >= \"$since\")
                       | select(.conclusion == \"success\")
                      ] | .[].databaseId"); do
              hit=$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs" \
                --jq "[.jobs[]
                       | select(.name | startswith(\"$job\"))
                       | select(.conclusion == \"success\")
                      ] | length")
              if [ "$hit" -gt 0 ]; then
                echo "OK: $workflow — сбор выполнен, run $run_id"
                work_ok=1
                break
              fi
            done
            if [ "$work_ok" -eq 0 ]; then
              echo "ПРОПУСК: $workflow не выполнил сбор с $since"
              return 1
            fi
            return 0
          }

          check gz-daily-pk.yml   pk-plans       "$pk_since"   || failed=1
          check gz-daily-main.yml plans-and-lots "$main_since" || failed=1

          if [ "$failed" -ne 0 ]; then
            echo
            echo "Запустить вручную: gh workflow run <workflow> --ref main"
            echo "Повторный прогон безопасен — дедупликация идёт в Bitrix по UF_CRM_PLAN_ID."
            exit 1
          fi
          echo "Обе ежедневные задачи выполнили сбор."
